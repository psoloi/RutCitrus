# 构建并发布 RtCli(Windows/Linux)、RtPanel(Windows/Linux) 与 Rt 扩展库
# 产物：RtCli.zip、RtCli-linux.zip、RtPanel.zip、RtPanel-linux.zip、Rt.dll
# 发布说明中的「更新简略」取自本次构建对应提交的 git 提交消息

name: .NET 10 Console RCT

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-publish:
    name: Build & Publish (Windows + Linux)
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.create-tag.outputs.tag }}
      commit_message: ${{ steps.commit-msg.outputs.message }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore ./RtCli/RtCli.csproj
          dotnet restore ./RtPanel/RtPanel.csproj
          dotnet restore ./Rt/Rt.csproj
          dotnet restore ./RtCli.Tests/RtCli.Tests.csproj

      - name: Build
        run: dotnet build ./RtCli/RtCli.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ./RtCli.Tests/RtCli.Tests.csproj --configuration Release --verbosity normal

      # 说明：*.pubxml 默认被 .gitignore 忽略，CI 中不依赖本地的发布配置文件，直接传入 MSBuild 属性
      - name: Publish RtCli (win-x64)
        run: dotnet publish ./RtCli/RtCli.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./out/rtcli-win

      - name: Publish RtCli (linux-x64)
        run: dotnet publish ./RtCli/RtCli.csproj -c Release -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./out/rtcli-linux

      - name: Publish RtPanel (win-x64)
        run: dotnet publish ./RtPanel/RtPanel.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./out/rtpanel-win

      - name: Publish RtPanel (linux-x64)
        run: dotnet publish ./RtPanel/RtPanel.csproj -c Release -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./out/rtpanel-linux

      - name: Build Rt extension
        run: |
          dotnet build ./Rt/Rt.csproj -c Release
          # Rt 为托管类库，dll 与平台无关，Windows/Linux 通用
          New-Item -ItemType Directory -Force -Path ./out | Out-Null
          Copy-Item ./Rt/bin/Release/net10.0/Rt.dll ./out/Rt.dll -Force

      - name: Verify artifacts
        run: |
          $required = @(
            "./out/rtcli-win/RtCli.exe",
            "./out/rtcli-linux/RtCli",
            "./out/rtpanel-win/RtPanel.exe",
            "./out/rtpanel-linux/RtPanel",
            "./out/Rt.dll"
          )
          foreach ($p in $required) {
              if (-not (Test-Path $p)) {
                  Write-Error "产物缺失: $p"
                  exit 1
              }
              $len = (Get-Item $p).Length
              Write-Output ("{0}  {1:N2} MB" -f $p, ($len / 1MB))
          }
          # 校验 Linux 主程序为 ELF 可执行文件
          $bytes = [System.IO.File]::ReadAllBytes("./out/rtcli-linux/RtCli")[0..3]
          $magic = ($bytes | ForEach-Object { [char]$_ }) -join ''
          if ($magic -ne "ELF") {
              Write-Error "linux 产物不是 ELF 可执行文件: $magic"
              exit 1
          }

      - name: Create zip packages
        run: |
          $packages = @(
            @{ Name = "RtCli.zip"; Path = "./out/rtcli-win" },
            @{ Name = "RtCli-linux.zip"; Path = "./out/rtcli-linux" },
            @{ Name = "RtPanel.zip"; Path = "./out/rtpanel-win" },
            @{ Name = "RtPanel-linux.zip"; Path = "./out/rtpanel-linux" }
          )
          foreach ($pkg in $packages) {
              if (Test-Path $pkg.Name) { Remove-Item $pkg.Name -Force }
              Compress-Archive -Path "$($pkg.Path)/*" -DestinationPath $pkg.Name -Force
              Write-Output ("{0}  {1:N2} MB" -f $pkg.Name, ((Get-Item $pkg.Name).Length / 1MB))
          }

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force -Path ./release-assets | Out-Null
          Copy-Item -Path @("./RtCli.zip", "./RtCli-linux.zip", "./RtPanel.zip", "./RtPanel-linux.zip", "./out/Rt.dll") -Destination ./release-assets -Force
          Get-ChildItem ./release-assets | ForEach-Object { Write-Output $_.Name }

      - name: Read commit message
        id: commit-msg
        run: |
          $msg = (git log -1 --pretty=format:"%B").Trim()
          if ([string]::IsNullOrWhiteSpace($msg)) { $msg = "无提交说明" }
          "message<<EOF" >> $env:GITHUB_OUTPUT
          $msg >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Generate build tag
        id: create-tag
        if: github.ref == 'refs/heads/master'
        run: |
          $commitSha = git rev-parse --short HEAD
          $dateStr = Get-Date -Format "yyyyMMdd-HHmmss"
          $tagName = "release-$dateStr-$commitSha"
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 检查并推送标签
          git tag -f $tagName
          git push origin $tagName --force
          
          echo "tag=$tagName" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-Assets
          path: ./release-assets
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ needs.build-and-publish.outputs.release_tag != '' }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Release-Assets
          path: ./release-assets

      - name: Setup current time
        id: set-time
        run: echo "TIME=$(date)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-and-publish.outputs.release_tag }}
          name: Release ${{ needs.build-and-publish.outputs.release_tag }}
          body: |
            ## 🚀 自动构建版本
            - 提交哈希: ${{ github.sha }}
            - 构建时间: ${{ steps.set-time.outputs.TIME }}
            - 构建标签: ${{ needs.build-and-publish.outputs.release_tag }}

            ### 更新简略
            ${{ needs.build-and-publish.outputs.commit_message }}

            ### 发布文件
            | 文件 | 平台 | 说明 |
            | ---- | ---- | ---- |
            | RtCli.zip | Windows x64 | 主程序(自包含) |
            | RtCli-linux.zip | Linux x64 | 主程序(自包含) |
            | RtPanel.zip | Windows x64 | 管理面板(自包含) |
            | RtPanel-linux.zip | Linux x64 | 管理面板(自包含) |
            | Rt.dll | 跨平台 | Rt 扩展库(Windows/Linux 通用) |

            ### Linux 使用说明
            - 解压后执行 `./RtCli` 或 `./RtPanel`（首次需 `chmod +x`，解压工具通常已保留执行权限）
            - 抓包功能需安装 libpcap：`apt install libpcap0.8` 或 `yum install libpcap`，并以 root 或授予 `CAP_NET_RAW` 权限运行
          files: |
            release-assets/RtCli.zip
            release-assets/RtCli-linux.zip
            release-assets/RtPanel.zip
            release-assets/RtPanel-linux.zip
            release-assets/Rt.dll
