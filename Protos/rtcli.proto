syntax = "proto3";

package rtcli;

option csharp_namespace = "RtCli.Grpc";

service RtCliService {
  rpc GetServerInfo (Empty) returns (ServerInfoResponse);
  rpc GetExtensions (Empty) returns (ExtensionListResponse);
  rpc UnloadExtension (UnloadExtensionRequest) returns (UnloadExtensionResponse);
  rpc LoadExtension (LoadExtensionRequest) returns (LoadExtensionResponse);
  rpc ExecuteCommand (ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc StreamLogs (Empty) returns (stream LogMessage);
  rpc GetClients (Empty) returns (ClientListResponse);
  rpc GetStatus (Empty) returns (StatusResponse);
  rpc GetConfig (Empty) returns (ConfigResponse);
  rpc SaveConfig (SaveConfigRequest) returns (SaveConfigResponse);
  rpc GetCommandList (Empty) returns (CommandListResponse);
  // 多配置文件支持：按文件名读写RtCli管理的YAML配置文件
  rpc ListConfigFiles (Empty) returns (ConfigFileListResponse);
  rpc GetConfigFile (ConfigFileRequest) returns (ConfigResponse);
  rpc SaveConfigFile (SaveConfigFileRequest) returns (SaveConfigResponse);
  // 系统状态：主机CPU/内存 + 各MC服务端TPS
  rpc GetSystemStats (Empty) returns (SystemStatsResponse);
  // MC 服务端配置文件管理(server.properties, ops.json 等)
  rpc ListServerFiles (ServerFileListRequest) returns (ServerFileListResponse);
  rpc GetServerFile (ServerFileRequest) returns (ServerFileResponse);
  rpc SaveServerFile (SaveServerFileRequest) returns (SaveConfigResponse);
  // 实例管理(实例 = server_list 扩展, server_data.json 存储元数据)
  rpc GetInstanceList (Empty) returns (InstanceListResponse);
  rpc CreateInstance (CreateInstanceRequest) returns (InstanceActionResponse);
  rpc DeleteInstance (DeleteInstanceRequest) returns (InstanceActionResponse);
  rpc UpdateInstance (UpdateInstanceRequest) returns (InstanceActionResponse);
  rpc InstanceAction (InstanceActionRequest) returns (InstanceActionResponse);
  rpc CreateGroup (CreateGroupRequest) returns (InstanceActionResponse);
  rpc DeleteGroup (DeleteGroupRequest) returns (InstanceActionResponse);
  rpc UpdateGroup (UpdateGroupRequest) returns (InstanceActionResponse);
  rpc GroupAction (GroupActionRequest) returns (InstanceActionResponse);
  rpc GetInstanceDetail (InstanceDetailRequest) returns (InstanceDetailResponse);
  rpc CreateBackup (CreateBackupRequest) returns (InstanceActionResponse);
  rpc RestoreBackup (RestoreBackupRequest) returns (InstanceActionResponse);
  rpc DeleteBackup (DeleteBackupRequest) returns (InstanceActionResponse);
  rpc GetTaskList (GetTaskListRequest) returns (TaskListResponse);
  rpc GetRtStatus (Empty) returns (RtStatusResponse);
  rpc GetPanelData (Empty) returns (PanelDataResponse);
  rpc SavePanelData (PanelDataRequest) returns (PanelDataResponse);
  // 配置文件项注释：按文件名获取键路径→中文说明字典(由 RtCli Repository 管理)
  rpc GetConfigDocs (ConfigFileRequest) returns (ConfigDocsResponse);
  // 分析实例错误日志(正则提取)
  rpc AnalyzeInstanceErrors (InstanceDetailRequest) returns (InstanceErrorsResponse);
  // AI分析实例错误
  rpc AiAnalyzeInstanceErrors (AiAnalyzeRequest) returns (AiAnalyzeResponse);
  // 基础分析实例错误(对应控制台 .fx base: 用 base 规则库匹配错误)
  rpc BaseAnalyzeInstanceErrors (AiAnalyzeRequest) returns (BaseAnalyzeResponse);
  // AI 技能管理(读写 ai_settings.yml 中 ServerAutoAi.skills)
  rpc GetAiSkills (Empty) returns (AiSkillListResponse);
  rpc SaveAiSkill (SaveAiSkillRequest) returns (SimpleResponse);
  rpc DeleteAiSkill (DeleteAiSkillRequest) returns (SimpleResponse);
  rpc ImportAiSkills (ImportAiSkillsRequest) returns (AiSkillListResponse);
  // AI 记忆(读取 memory.json 条目, 读写记忆设置)
  rpc GetAiMemories (Empty) returns (AiMemoryListResponse);
  rpc SaveAiMemorySettings (AiMemorySettingsRequest) returns (SimpleResponse);
  rpc ClearAiMemories (Empty) returns (SimpleResponse);
  // AI 自动化观测: 任务状态 / 工具调用审计 / 历史结论
  rpc GetAiAutomationStatus (Empty) returns (AiAutomationStatusResponse);
  rpc GetAiToolAudit (AiToolAuditRequest) returns (AiToolAuditResponse);
  rpc GetAiResponses (AiResponseListRequest) returns (AiResponseListResponse);
  rpc DeleteAiResponse (DeleteAiResponseRequest) returns (SimpleResponse);
  // AI 自动化规则(系统提示中的"必须遵守的规则")
  rpc GetAiRules (Empty) returns (AiRuleListResponse);
  rpc SaveAiRules (AiRuleListRequest) returns (SimpleResponse);
  // AI 工作流(工作流编辑器: 读写 ai_settings.yml 中 ServerAutoAi 的任务列表与运行参数)
  rpc GetAiWorkflow (Empty) returns (AiWorkflowResponse);
  rpc SaveAiTask (AiTaskRequest) returns (SimpleResponse);
  rpc DeleteAiTask (AiTaskKeyRequest) returns (SimpleResponse);
  rpc SaveAiRuntime (AiRuntimeRequest) returns (SimpleResponse);
  // 调度器任务(蓝图编辑器: 触发 -> 条件 -> 执行)
  rpc GetSchedulerTasks (Empty) returns (SchedulerTaskListResponse);
  rpc SaveSchedulerTask (SchedulerTaskRequest) returns (SimpleResponse);
  rpc DeleteSchedulerTask (SchedulerTaskKeyRequest) returns (SimpleResponse);
  // 玩家事件监控: 获取指定实例的玩家活动日志
  rpc GetPlayerEvents (PlayerEventRequest) returns (PlayerEventListResponse);
  // 事件板: 实例生命周期事件(开启/关闭/崩溃/自动重启/stop无响应)
  rpc GetEventBoard (EventBoardRequest) returns (EventBoardResponse);
  rpc MarkEventBoardRead (Empty) returns (SimpleResponse);
  rpc ClearEventBoard (Empty) returns (SimpleResponse);
  // 面板上报事件到事件板(如文件上传进度); event_key 非空且已存在时更新同一条(进度刷新), 否则追加
  rpc ReportBoardEvent (ReportBoardEventRequest) returns (SimpleResponse);
  // 插件/模组管理
  rpc ListPlugins (InstanceDetailRequest) returns (JarFileListResponse);
  rpc ListMods (InstanceDetailRequest) returns (JarFileListResponse);
  rpc ToggleJarFile (ManageJarFileRequest) returns (SimpleResponse);
  rpc DeleteJarFile (ManageJarFileRequest) returns (SimpleResponse);
  rpc UploadJarFile (UploadJarFileRequest) returns (SimpleResponse);
  // 插件更新(Modrinth): 用 plugin.yml 的插件名搜索并比对版本, 可下载替换
  rpc UpdatePlugin (UpdatePluginRequest) returns (UpdatePluginResponse);
  // 实例文件管理: 浏览/上传/下载/删除/重命名(移动)工作目录内的文件, 工作目录为根
  rpc ListInstanceDir (InstanceDirRequest) returns (InstanceDirResponse);
  rpc DownloadInstanceFile (InstanceFileRequest) returns (stream FileDataChunk);
  rpc UploadInstanceFileChunk (InstanceFileChunkRequest) returns (SimpleResponse);
  rpc DeleteInstanceEntry (InstanceEntryRequest) returns (SimpleResponse);
  rpc RenameInstanceEntry (InstanceRenameRequest) returns (SimpleResponse);
  // 实例文件管理: 文本文件编辑(配置文件等)
  rpc ReadInstanceTextFile (InstanceFileRequest) returns (InstanceTextFileResponse);
  rpc WriteInstanceTextFile (InstanceTextFileWriteRequest) returns (SimpleResponse);
  // 玩家管理
  rpc ManagePlayer (ManagePlayerRequest) returns (SimpleResponse);
  // 全服配置(RM 管理协议 serversettings 读写)
  rpc GetServerSettings (InstanceDetailRequest) returns (ServerSettingsResponse);
  rpc SetServerSettings (SetServerSettingsRequest) returns (SimpleResponse);
  // RM 管理协议通用操作: 游戏规则/名单(白名单/OP/封禁/IP封禁)/服务器控制/能力发现
  rpc ManageServer (ManageServerRequest) returns (ManageServerResponse);
  // 面板向导: 服务端类型/版本列表与下载(对应 .guide 引导能力)
  rpc GetServerTypes (Empty) returns (ServerTypeListResponse);
  rpc GetServerVersions (ServerVersionRequest) returns (ServerVersionListResponse);
  rpc DownloadServerJar (DownloadServerJarRequest) returns (DownloadServerJarResponse);
  // 面板向导: 群组服务器一键构建(对应 .group build 向导能力)
  rpc GroupBuild (GroupBuildRequest) returns (GroupBuildResponse);
  // 实例增强: Java 路径扫描(常见安装目录+JAVA_HOME+PATH)
  rpc ScanJavaPaths (Empty) returns (JavaScanResponse);
  // 实例增强: 克隆实例(复制配置, 可选复制工作目录文件)
  rpc CloneInstance (CloneInstanceRequest) returns (InstanceActionResponse);
  // 实例增强: 解压实例工作目录中的 zip 并返回第一层启动脚本(bat/cmd/sh)
  rpc ExtractInstanceArchive (ExtractArchiveRequest) returns (ExtractArchiveResponse);
}

message Empty {}

message ServerInfoResponse {
  string server_name = 1;
  string version = 2;
  int32 port = 3;
  bool is_running = 4;
}

message ExtensionInfo {
  string key = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string load_time = 5;
}

message ExtensionListResponse {
  repeated ExtensionInfo extensions = 1;
}

message UnloadExtensionRequest {
  string extension_key = 1;
}

message UnloadExtensionResponse {
  bool success = 1;
  string message = 2;
}

message LoadExtensionRequest {
  string extension_path = 1;
}

message LoadExtensionResponse {
  bool success = 1;
  string message = 2;
}

message ExecuteCommandRequest {
  string command = 1;
  string instance_id = 2;           // 目标实例(ServerList key), 空 = 当前实例
}

message ExecuteCommandResponse {
  bool success = 1;
  string result = 2;
}

message LogMessage {
  string timestamp = 1;
  int32 level = 2;
  string source = 3;
  string message = 4;
  string instance_id = 5;           // 日志归属实例, 空 = 全局消息
}

message ClientInfo {
  string id = 1;
  string ip = 2;
  string connect_time = 3;
}

message ClientListResponse {
  repeated ClientInfo clients = 1;
}

message StatusResponse {
  bool is_running = 1;
  int32 connected_client_count = 2;
  int32 extension_count = 3;
  string server_name = 4;
}

message ConfigResponse {
  bool success = 1;
  string content = 2;
  string message = 3;
}

message SaveConfigRequest {
  string content = 1;
}

message SaveConfigResponse {
  bool success = 1;
  string message = 2;
}

message CommandInfo {
  string command = 1;
  string description = 2;
}

message CommandListResponse {
  repeated CommandInfo commands = 1;
}

// 多配置文件支持
message ConfigFileRequest {
  string file_name = 1;
}

message SaveConfigFileRequest {
  string file_name = 1;
  string content = 2;
}

message ConfigFileInfo {
  string file_name = 1;
  string display_name = 2;
  string description = 3;
}

message ConfigFileListResponse {
  repeated ConfigFileInfo files = 1;
}

// 系统状态
message ServerTpsInfo {
  string server_key = 1;       // ServerList 中的键
  string server_name = 2;      // 显示名
  bool is_running = 3;
  double tps = 4;              // -1 表示未获取/不支持(兼容字段，等同 tps_1m)
  string tps_status = 5;       // 文本描述(如 "20.0"、"未运行"、"需要Spark插件")
  int32 mc_pid = 6;
  double mc_memory_mb = 7;     // MC 进程内存(MB)
  double tps_1m = 8;           // 最近 1 分钟 TPS(-1 表示未获取)
  double tps_5m = 9;           // 最近 5 分钟 TPS
  double tps_15m = 10;         // 最近 15 分钟 TPS
  double mc_cpu_usage = 11;    // MC 进程 CPU 占用率(%)，-1 表示未获取
  int32 player_count = 12;     // 在线玩家数(-1 表示未获取)
  int32 player_max = 13;       // 最大玩家数(-1 表示未获取)
}

message SystemStatsResponse {
  bool success = 1;
  string message = 2;
  double cpu_usage = 3;            // 主机CPU使用率(%)，-1 表示不支持
  double memory_used_mb = 4;
  double memory_total_mb = 5;
  repeated ServerTpsInfo servers = 6;
  string current_server_key = 7;   // 当前选择的服务器标识
  bool ai_running = 8;             // AI自动化是否运行中
  bool scheduler_running = 9;      // 计划任务调度器是否运行中
}

// 任务列表
message GetTaskListRequest {
  string task_type = 1;            // "ai" 或 "auto"
}

message TaskItem {
  string key = 1;
  string name = 2;
  bool enabled = 3;
  string trigger = 4;
  string interval = 5;
  string execute = 6;
  int32 run_count = 7;
  string last_run = 8;
  string status = 9;               // 启用/禁用/不适用/已过期/已完成
}

message TaskListResponse {
  bool success = 1;
  string message = 2;
  bool is_running = 3;             // 运行器是否运行中
  repeated TaskItem tasks = 4;
}

// RtCli 运行状态
message RtStatusResponse {
  bool success = 1;
  string message = 2;
  bool management_port_running = 3;   // 管理端口运行中
  int32 connected_clients = 4;        // 已连接面板数
  string current_server_key = 5;      // 当前服务器标识
  string current_server_name = 6;     // 当前服务器名称
  string mc_mode = 7;                 // MC 模式
  bool mc_running = 8;                // MC 服务端运行中
  bool mc_connected = 9;             // MC 已连接(Attach 模式)
  bool auto_tips_running = 10;        // 自动提示运行中
  bool ai_running = 11;               // AI 自动化运行中
  bool scheduler_running = 12;        // 调度器运行中
  string mc_version = 13;             // MC 服务端版本(取自 jar 内 version.json 的 id)
  string server_jar = 14;             // 探测到版本的服务端 jar 文件名
}

// 面板设置 (panel_data.json)
message PanelDataResponse {
  bool success = 1;
  string message = 2;
  string json_data = 3;               // JSON 格式的设置数据
}

message PanelDataRequest {
  string json_data = 1;               // JSON 格式的设置数据
}

// MC 服务端配置文件
message ServerFileInfo {
  string file_name = 1;           // 文件名(相对 WorkPath)
  string display_name = 2;        // 显示名
  string description = 3;         // 描述
  string category = 4;            // 分类: properties/json/whitelist/ban/etc
  bool editable = 5;              // 是否可写(ops.json 等运行时文件可能只读)
  int64 size_bytes = 6;           // 文件大小
}

message ServerFileListRequest {
  string server_key = 1;          // 留空则使用 RtCli 当前选中的服务器
}

message ServerFileListResponse {
  bool success = 1;
  string message = 2;
  string server_key = 3;          // 对应的 ServerList 键
  string server_name = 4;
  string work_path = 5;           // MC 服务端工作目录
  repeated ServerFileInfo files = 6;
}

message ServerFileRequest {
  string server_key = 1;          // ServerList 中的键，留空则用 current_server
  string file_name = 2;           // 文件名
  int32 tail_lines = 3;           // >0 时仅返回文件尾部 N 行(用于大日志文件，服务端截取)
}

message ServerFileResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
  string file_name = 4;
  string category = 5;
}

message SaveServerFileRequest {
  string server_key = 1;
  string file_name = 2;
  string content = 3;
}

// ===== 实例管理 =====
message InstanceInfo {
  string id = 1;              // 内部 ID(= ServerList key = identifier)
  string identifier = 2;      // 用户可见标识
  string name = 3;            // 显示名
  string group_id = 4;        // 所属群组 ID(空 = 独立实例)
  string group_name = 5;      // 所属群组名(便于前端显示)
  bool is_running = 6;        // 运行状态
  bool hidden = 7;            // 是否隐藏控制台消息
  bool auto_restart = 8;      // 自动重启
  string work_path = 9;
  string java_path = 10;
  string run_flags = 11;
  string analyzer_mode = 12;  // RM / RUN / RR / RCON (旧名 Management/Run/Rcon/OnlyRcon 自动映射)
  string created_at = 13;
  string last_started_at = 14;
}

message GroupInfo {
  string id = 1;
  string name = 2;
  repeated string member_ids = 3;
  string created_at = 4;
}

message InstanceListResponse {
  bool success = 1;
  string message = 2;
  repeated InstanceInfo instances = 3;
  repeated GroupInfo groups = 4;
  string current_server_key = 5;    // RtCli 当前选中的实例(= server_list key), 免去前端再查较慢的 GetSystemStats
}

message CreateInstanceRequest {
  string identifier = 1;
  string name = 2;
  string work_path = 3;
  string java_path = 4;
  string run_flags = 5;
  string analyzer_mode = 6;
  string group_id = 7;        // 可选: 创建时直接加入群组
}

message DeleteInstanceRequest {
  string id = 1;
  bool delete_files = 2;      // 是否删除服务器文件( WorkPath)
}

message UpdateInstanceRequest {
  string id = 1;
  string name = 2;
  string group_id = 3;        // 空 = 移出群组
  bool hidden = 4;            // 同步到 config.yml hide_console_servers
  bool auto_restart = 5;
  string work_path = 6;
  string java_path = 7;
  string run_flags = 8;
  string analyzer_mode = 9;
}

message InstanceActionRequest {
  string action = 1;          // start | stop | restart
  repeated string ids = 2;    // 批量操作的目标实例 ID 列表
}

message GroupActionRequest {
  string action = 1;          // start_all | stop_all | restart_all
  string group_id = 2;
}

message CreateGroupRequest {
  string name = 1;
  repeated string member_ids = 2;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message UpdateGroupRequest {
  string operation = 1;       // add | remove | rename
  string group_id = 2;
  string name = 3;            // rename 时使用
  repeated string member_ids = 4;  // add/remove 时使用
}

message InstanceActionResponse {
  bool success = 1;
  string message = 2;
}

message InstanceDetailRequest {
  string id = 1;
}

message BackupEntry {
  string file_name = 1;
  string created_at = 2;
  int64 size_bytes = 3;
}

message InstanceDetailResponse {
  bool success = 1;
  string message = 2;
  InstanceInfo instance = 3;
  repeated BackupEntry backups = 4;
}

message CreateBackupRequest {
  string id = 1;
}

message RestoreBackupRequest {
  string id = 1;
  string file_name = 2;
}

message DeleteBackupRequest {
  string id = 1;
  string file_name = 2;
}

// 配置文件项注释响应
message ConfigDocsResponse {
  bool success = 1;
  string message = 2;
  string file_name = 3;
  map<string, string> docs = 4;     // 键路径 → 中文说明
}

// 实例错误分析响应
message InstanceErrorsResponse {
  bool success = 1;
  string message = 2;
  map<int32, string> errors = 3;    // 编号 → 错误内容
}

// AI分析请求
message AiAnalyzeRequest {
  string id = 1;                    // 实例ID
  string range = 2;                 // 错误编号范围(如 "1" 或 "1-3"，空=全部)
}

// AI分析响应
message AiAnalyzeResponse {
  bool success = 1;
  string message = 2;
  string result = 3;                // AI分析结果文本
}

// 基础分析响应(.fx base 规则匹配)
message BaseAnalyzeResponse {
  bool success = 1;
  string message = 2;
  repeated BaseMatch matches = 3;   // 命中的基础规则
}

message BaseMatch {
  string topic = 1;                 // 问题主题
  string solution = 2;              // 解决方案
  string action = 3;                // 可执行的修复脚本名(可能为空)
  string matched = 4;               // 命中的日志片段(截断)
}

// ===== 玩家事件监控 =====
message PlayerEventRequest {
  string id = 1;                    // 实例ID(服务器标识)
  int32 limit = 2;                  // 返回最近N条(0=全部)
}

message PlayerEventLog {
  string event_type = 1;            // join/connect/lost/leave/command/chat/setmode/custom
  string player_name = 2;
  string trigger_time = 3;          // 原始日志中的时间字符串
  string recorded_at = 4;           // 记录时间(ISO 8601)
  string detail = 5;                // 附加详情(IP/原因/命令/消息等)
}

message PlayerEventListResponse {
  bool success = 1;
  string message = 2;
  repeated PlayerEventLog events = 3;
}

// ===== 事件板(实例生命周期事件) =====
message EventBoardRequest {
  int32 limit = 1;                  // 返回最近N条(0=全部)
  string instance_id = 2;           // 可选过滤: 仅返回该实例事件(空=全部)
}

message BoardEvent {
  int64 id = 1;                     // 自增序号(用于已读判断)
  string event_type = 2;            // started/stopped/crashed/auto_restarted/stop_unresponsive
  string instance_id = 3;           // 实例标识(ServerList key)
  string instance_name = 4;         // 实例显示名
  string title = 5;                 // 主题
  string detail = 6;                // 详细信息
  string recorded_at = 7;           // 记录时间(ISO 8601)
}

message EventBoardResponse {
  bool success = 1;
  string message = 2;
  int64 last_read_id = 3;           // 已读水位(id <= last_read_id 视为已读)
  repeated BoardEvent events = 4;
}

// 面板上报事件(如文件上传进度): event_key 非空且已存在则更新同一条(进度刷新), 否则追加新事件
message ReportBoardEventRequest {
  string event_key = 1;             // 稳定键(空=追加; 非空=同键更新, 保证一次操作只占一行)
  string event_type = 2;            // 事件类型(如 file_upload)
  string instance_id = 3;           // 实例标识(ServerList key)
  string title = 4;                 // 主题
  string detail = 5;                // 详细信息
}

// ===== 插件/模组管理 =====
message JarFileInfo {
  string file_name = 1;
  int64 size_bytes = 2;
  bool is_disabled = 3;
  string name = 4;          // 从 jar 内元数据(plugin.yml 等)解析出的插件名
  string version = 5;       // 解析出的插件版本
  string description = 6;   // 解析出的插件介绍
  bool meta_parsed = 7;     // 是否成功解析插件元数据(失败时面板标黄提示可能无法加载)
}

message JarFileListResponse {
  bool success = 1;
  string message = 2;
  repeated JarFileInfo files = 3;
}

// type: "plugin" 或 "mod"
message ManageJarFileRequest {
  string id = 1;
  string file_name = 2;
  string type = 3;
}

message UploadJarFileRequest {
  string id = 1;
  string file_name = 2;
  string type = 3;             // "plugin" 或 "mod"
  bytes content = 4;
}

// ===== 实例文件管理 =====
message InstanceDirRequest {
  string id = 1;
  string rel_path = 2;         // 相对工作目录的路径("" = 根)
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size_bytes = 3;
  string modified_at = 4;
}

message InstanceDirResponse {
  bool success = 1;
  string message = 2;
  string work_path = 3;
  repeated DirEntry entries = 4;
}

message InstanceFileRequest {
  string id = 1;
  string rel_path = 2;
}

message FileDataChunk {
  bytes data = 1;
}

// offset=0 时服务端截断临时文件; final=true 时提交(临时文件改名为正式文件)
message InstanceFileChunkRequest {
  string id = 1;
  string rel_path = 2;
  int64 offset = 3;
  bytes data = 4;
  bool final = 5;
}

message InstanceEntryRequest {
  string id = 1;
  string rel_path = 2;
  bool recursive = 3;
}

message InstanceRenameRequest {
  string id = 1;
  string old_path = 2;
  string new_path = 3;
}

message InstanceTextFileResponse {
  bool success = 1;
  string message = 2;
  string content = 3;
  int64 size_bytes = 4;
}

message InstanceTextFileWriteRequest {
  string id = 1;
  string rel_path = 2;
  string content = 3;
}

// ===== 玩家管理 =====
// action: "ban" / "pardon" / "ban_ip" / "pardon_ip" / "kick" / "custom"
message ManagePlayerRequest {
  string id = 1;
  string action = 2;
  string target = 3;           // 玩家名或IP
  string reason = 4;           // 封禁/踢出原因
  string command = 5;          // action=custom 时的自定义命令
}

message SimpleResponse {
  bool success = 1;
  string message = 2;
}

// ===== 全服配置(RM 管理协议 serversettings) =====
message ServerSettingEntry {
  string key = 1;       // serversettings 键, 如 difficulty
  string value = 2;     // 当前值(已序列化为字符串: 布尔 true/false、数字、字符串)
  string type = 3;      // bool / int / enum / string
  string label = 4;     // 中文显示名
  repeated string options = 5; // enum 类型的可选值(bool/int/string 为空)
}
message ServerSettingsResponse {
  bool success = 1;
  string message = 2;
  repeated ServerSettingEntry settings = 3;
}
message ServerSettingValue {
  string key = 1;
  string value = 2;
}
message SetServerSettingsRequest {
  string instance_id = 1;
  repeated ServerSettingValue values = 2;
}

// ===== RM 管理协议通用操作 =====
// category: gamerules / allowlist / operators / bans / ip_bans / server / discover
// action:   get / add / remove / clear / set(规则) / save / stop / system_message / status
message ManageServerRequest {
  string instance_id = 1;
  string category = 2;
  string action = 3;
  string target = 4;   // 名称/规则名/IP
  string value = 5;    // 值: 规则值 / 封禁原因 / 消息文本
  bool flag = 6;       // system_message 是否作为标题叠加显示
}
message RmServerEntry {
  string name = 1;     // 玩家名 / IP / 规则名
  string value = 2;    // 封禁原因 / 规则值
  string extra = 3;    // 附加信息(IP/UUID/来源等)
}
message ManageServerResponse {
  bool success = 1;
  string message = 2;
  repeated RmServerEntry entries = 3;
  string raw = 4;      // discover / status 的原始 JSON
}

// ===== 面板向导: 服务端下载 =====
message ServerTypeInfoMsg {
  string name = 1;          // 显示名: "Paper (高性能)"
  string type_key = 2;      // 类型键: paper / vanilla / velocity ...
  bool downloadable = 3;    // 是否支持自动下载
  string website = 4;       // 手动下载地址(downloadable=false 时使用)
  string default_jar = 5;   // 默认 jar 文件名
}

message ServerTypeListResponse {
  bool success = 1;
  string message = 2;
  repeated ServerTypeInfoMsg server_types = 3;  // 注: 字段名避开 types(C# 生成器保留字)
}

message ServerVersionRequest {
  string type_key = 1;
}

message ServerVersionListResponse {
  bool success = 1;
  string message = 2;
  repeated string versions = 3;    // 常用版本列表(首个为最新)
  repeated string all_versions = 4; // 全部版本(前端可展开更多)
}

message DownloadServerJarRequest {
  string type_key = 1;
  string version = 2;              // 留空 = 最新版
  string work_path = 3;            // 下载目标目录(不存在则创建)
}

message DownloadServerJarResponse {
  bool success = 1;
  string message = 2;
  string jar_name = 3;             // 下载后的 jar 文件名(用于启动参数 -jar)
}

// ===== 面板向导: 群组一键构建 =====
message GroupBuildRequest {
  string group_name = 1;
  repeated string member_ids = 2;  // 加入群组的子服务器实例 ID
  string proxy_type = 3;           // velocity / bungeecord / manual
  string proxy_id = 4;             // 代理实例标识
  int32 proxy_port = 5;            // 玩家连接端口(默认 25565)
  bool auto_ports = 6;             // 是否自动分配子服务器端口
  int32 port_range_start = 7;      // 自动分配端口范围起
  int32 port_range_end = 8;        // 自动分配端口范围止
  bool online_mode = 9;            // 在线模式(正版验证)
  string lobby_server = 10;        // 玩家首入服务器(实例 ID, 可空)
}

message GroupBuildResponse {
  bool success = 1;
  string message = 2;
  string group_id = 3;
  string proxy_instance_id = 4;
  map<string, int32> server_ports = 5;  // 分配结果: 实例ID -> 端口
}

// ===== 实例增强 =====

message JavaInfo {
  string path = 1;       // java 可执行文件完整路径
  string version = 2;    // 版本号(从目录名或 java -version 获取)
  string source = 3;     // 来源说明(JAVA_HOME / PATH / 安装目录)
}

message JavaScanResponse {
  bool success = 1;
  string message = 2;
  repeated JavaInfo javas = 3;
}

message CloneInstanceRequest {
  string id = 1;             // 源实例 ID
  string new_identifier = 2; // 新实例标识(空 = 自动 "{id}-copy")
  string new_name = 3;       // 新实例显示名(空 = 自动)
  bool copy_files = 4;       // 是否复制工作目录文件
}

message ExtractArchiveRequest {
  string id = 1;             // 实例 ID
  string rel_path = 2;       // zip 相对工作目录路径(如 __import__.zip)
}

message ExtractArchiveResponse {
  bool success = 1;
  string message = 2;
  repeated string scripts = 3;  // 解压后工作目录第一层的 bat/cmd/sh 文件名
}

// ===== AI 技能管理 =====
message AiSkillInfo {
  string name = 1;          // 技能名称
  string description = 2;   // 技能描述
  string behavior = 3;      // 技能行为(详细说明)
}

message AiSkillListResponse {
  bool success = 1;
  string message = 2;
  repeated AiSkillInfo skills = 3;
}

message SaveAiSkillRequest {
  string original_name = 1;  // 原技能名(空=新增; 非空=编辑, 用于在改名时定位)
  string name = 2;
  string description = 3;
  string behavior = 4;
}

message DeleteAiSkillRequest {
  string name = 1;
}

message ImportAiSkillsRequest {
  string content = 1;   // JSON 或 YAML 文本(技能数组、含 skills 的对象或单个技能对象)
  bool overwrite = 2;   // true=同名覆盖; false=跳过同名
}

// ===== AI 记忆 =====
message AiMemoryInfo {
  string time = 1;      // 时间
  string topic = 2;     // 记忆主题
  string content = 3;   // 记忆内容
}

message AiMemorySettings {
  bool enabled = 1;                 // 是否启用AI记忆
  bool use_ai = 2;                  // 是否用AI提炼(消耗token)
  int32 max_tokens = 3;             // token使用限制(记忆提炼最大输出token)
  int32 max_content_length = 4;     // 单条记忆内容最大字符数
  int32 max_entries = 5;            // memory.json 最大条数
  bool capture_server_info = 6;     // 记录服务器基本信息
  bool capture_player_count = 7;    // 记录服务器玩家数量
  bool capture_common_errors = 8;   // 记录服务器常见错误
  string prompt = 9;                // AI提炼记忆提示词
}

message AiMemoryListResponse {
  bool success = 1;
  string message = 2;
  repeated AiMemoryInfo memories = 3;
  AiMemorySettings settings = 4;
}

message AiMemorySettingsRequest {
  AiMemorySettings settings = 1;
}

// ===== AI 自动化观测 =====
message AiTaskStatus {
  string key = 1;                        // 任务标识(如 tps_monitor)
  string name = 2;                       // 任务名称
  bool enabled = 3;                      // 是否启用
  string trigger = 4;                    // 触发条件
  string interval = 5;                   // cron 间隔
  int32 min_trigger_interval_minutes = 6;// 最小触发间隔(分钟)
  string actions = 7;                    // 动作(逗号分隔)
  string last_run = 8;                   // 上次运行时间(空=从未运行)
  int32 run_count = 9;                   // 累计执行次数
  bool running = 10;                     // 该任务此刻是否正在执行
}

message AiAutomationStatusResponse {
  bool success = 1;
  string message = 2;
  bool runner_running = 3;               // AI 自动化总开关是否开启
  int32 memory_count = 4;                // 记忆条数
  int64 memory_bytes = 5;                // memory.json 大小(字节)
  int32 audit_count = 6;                 // 审计文件已记录条数
  repeated AiTaskStatus tasks = 7;
}

message AiToolAuditRequest {
  int32 limit = 1;                       // 取最近多少条(默认 100)
}

message AiToolAuditEntry {
  string time = 1;
  string task = 2;
  string tool = 3;
  string args = 4;
  string result = 5;
  bool ok = 6;
}

message AiToolAuditResponse {
  bool success = 1;
  string message = 2;
  repeated AiToolAuditEntry entries = 3;
  string file_path = 4;                  // 审计文件绝对路径(RtCli 侧)
}

message AiResponseListRequest {
  int32 limit = 1;                       // 取最近多少条(默认 50)
}

message AiResponseItem {
  string task_key = 1;
  string task_name = 2;
  string input_summary = 3;
  string ai_response = 4;
  string timestamp = 5;
}

message AiResponseListResponse {
  bool success = 1;
  string message = 2;
  repeated AiResponseItem responses = 3;
  int32 total = 4;                       // 文件内总条数
}

message DeleteAiResponseRequest {
  string timestamp = 1;                  // 时间戳(yyyy-MM-dd HH:mm:ss)
  string task_key = 2;                   // 任务标识(可空; 用于同时间戳时精确定位)
}

// ===== AI 自动化规则 =====
message AiRuleListResponse {
  bool success = 1;
  string message = 2;
  repeated string rules = 3;         // 规则列表(逐条注入系统提示)
  string system_prompt = 4;          // 系统总提示词(只读展示)
  bool runner_running = 5;           // AI 自动化是否运行中
}

message AiRuleListRequest {
  repeated string rules = 1;
}

// ===== AI 工作流(ai_settings.yml 的 ServerAutoAi 段) =====
message AiTaskConfig {
  string key = 1;                           // 任务标识(字典键, 如 tps_monitor)
  bool enabled = 2;                         // 是否启用
  string name = 3;                          // 任务名称
  string trigger = 4;                       // 触发条件
  repeated string input = 5;                // 数据源
  int32 limit = 6;                          // 提示词+输入内容最大token量
  string prompt = 7;                        // 该任务的提示词
  string interval = 8;                      // 6段Cron表达式
  repeated string actions = 9;              // 执行动作(ai / tools:工具名1,工具名2)
  int32 min_trigger_interval_minutes = 10;  // 最小触发间隔(分钟)
  int32 error_similarity_threshold = 11;    // 错误相似度阈值(百分比)
  int32 error_cache_minutes = 12;           // 错误缓存时长(分钟)
  repeated string server_keys = 13;         // 生效实例标识(空=全部实例; 当前实例不在列表中的任务不注册/不触发)
}

message AiRuntimeConfig {
  string prompt = 1;                        // 系统提示词(总)
  int32 max_tokens = 2;                     // AI输出最大token数
  string api_endpoint = 3;                  // API地址(留空复用Console_Error配置)
  bool api_key_set = 4;                     // 是否已配置密钥
  string api_key_masked = 5;                // 密钥掩码串(不回传明文)
  string model = 6;                         // 模型名称
  double temperature = 7;                   // 生成温度
  int32 request_timeout_seconds = 8;        // 请求超时(秒)
  bool retry_on_error = 9;                  // 异常时是否自动重连
  int32 retry_count = 10;                   // 最大重试次数
  bool save_response = 11;                  // 是否保存AI回复
  int32 context_cache_size = 12;            // 上下文缓存最大条数
  int32 max_tool_rounds = 13;               // 工具调用最大轮次
  string api_key = 14;                      // 密钥明文: 仅提交时使用; 响应中恒为空(仅回传 api_key_set/api_key_masked)
}

message AiWorkflowResponse {
  bool success = 1;
  string message = 2;
  AiRuntimeConfig runtime = 3;              // AI 运行参数
  repeated AiTaskConfig tasks = 4;          // 任务列表(工作流)
  repeated string available_tools = 5;      // 内置工具名(actions 中 tools: 可选值)
  repeated string default_triggers = 6;     // 合法触发条件提示
  string file_path = 7;                     // ai_settings.yml 路径
  bool runner_running = 8;                  // AI 自动化是否运行中
  repeated string available_events = 9;     // 合法事件名(内置事件 + CustomPlayerEvent + 自定义事件, 供 event: 触发条件使用)
}

message AiTaskRequest {
  AiTaskConfig task = 1;
  string original_key = 2;                  // 原键名(非空且与 task.key 不同时=改名, 用于定位旧键)
}

message AiTaskKeyRequest {
  string key = 1;
}

message AiRuntimeRequest {
  AiRuntimeConfig runtime = 1;              // runtime.api_key 为空串表示不修改密钥
}

// ===== 调度器任务(蓝图编辑器) =====
message SchedulerTaskInfo {
  string key = 1;
  bool enabled = 2;
  string trigger = 3;                // 触发条件(cron:/every:/daily:/date:/event:/组合)
  string condition = 4;              // 前置条件
  string execute = 5;                // 执行内容(script:/backup/restart/command:)
  bool pass_parameters = 6;
  repeated string server_keys = 7;   // 生效实例(空=全部)
  int32 timeout_ms = 8;
  int32 delay_minutes = 9;
  string delay_until = 10;
  bool execute_immediately = 11;
  int32 max_executions = 12;
  string expire_at = 13;
  string queue = 14;
  int32 run_count = 15;
}

message SchedulerTaskListResponse {
  bool success = 1;
  string message = 2;
  bool is_running = 3;
  repeated SchedulerTaskInfo tasks = 4;
  repeated string scripts = 5;      // 可用脚本名(执行方式=script 时下拉)
  repeated string events = 6;       // 合法事件名(触发方式=event 时下拉)
  repeated string servers = 7;      // 已配置实例标识(生效实例下拉)
}

message SchedulerTaskRequest {
  SchedulerTaskInfo task = 1;
}

message SchedulerTaskKeyRequest {
  string key = 1;
}

// ===== 插件更新(Modrinth) =====
message UpdatePluginRequest {
  string id = 1;          // 实例标识
  string file_name = 2;   // plugins 目录下的文件名(可含 .disjar)
  bool apply = 3;         // false=只检查版本, true=下载并替换
}

message UpdatePluginResponse {
  bool success = 1;
  string message = 2;
  bool has_update = 3;
  string local_version = 4;
  string remote_version = 5;
  string project_title = 6;
  string download_url = 7;
  string new_file_name = 8;
}
